<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Expense <em>Tracker</em></h1>
  <nav class="views" id="views">
    <button data-v="overview" class="on">Overview</button>
    <button data-v="daily">Daily</button>
  </nav>
  <div class="month-nav">
    <button id="prev" aria-label="Previous month">‹</button>
    <strong id="monthLabel"></strong>
    <button id="next" aria-label="Next month">›</button>
  </div>
</header>

<main id="viewOverview">
  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>Add entry</h2>
    <form id="form">
      <label>Type
        <select id="type">
          <option value="earning">Earning (weekly income)</option>
          <option value="monthly">Monthly payment (recurring)</option>
          <option value="saving">Savings</option>
          <option value="unexpected">Unexpected charge</option>
        </select>
      </label>
      <label>Amount ($)
        <input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label>Note
        <input id="note" type="text" maxlength="80" placeholder="e.g. Rent, Groceries, Car repair">
      </label>
      <button type="submit" class="primary">Add</button>
    </form>
    <p id="hint" class="muted"></p>
  </section>

  <section class="grid2">
    <div class="panel">
      <h2>Weekly earnings (last 8 weeks)</h2>
      <div id="weekChart"></div>
    </div>
    <div class="panel">
      <h2>Spending breakdown</h2>
      <div id="donut"></div>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <h2>Savings goal</h2>
      <label class="inline">Monthly goal ($)
        <input id="goal" type="number" min="0" step="1" placeholder="0">
      </label>
    </div>
    <div class="bar"><div id="goalFill"></div></div>
    <p id="goalText" class="muted"></p>
  </section>

  <section class="panel">
    <div class="row">
      <h2>Entries</h2>
      <div class="tabs" id="tabs"></div>
    </div>
    <ul id="list" class="list"></ul>
  </section>

  <section class="panel actions">
    <button id="exportCsv">Export CSV</button>
    <button id="exportJson">Backup (JSON)</button>
    <label class="btn">Restore <input id="importJson" type="file" accept="application/json" hidden></label>
    <button id="clearAll" class="danger">Clear all</button>
  </section>
</main>

<main id="viewDaily" hidden>
  <section class="panel">
    <div class="row">
      <div class="day-nav">
        <button id="dayPrev" aria-label="Previous day">‹</button>
        <strong id="dayLabel"></strong>
        <button id="dayNext" aria-label="Next day">›</button>
        <button id="dayToday">Today</button>
      </div>
      <div class="day-total"><small>Spent this day</small><b id="dayTotal">$0.00</b></div>
    </div>
    <form id="dayForm" class="dayform">
      <label>Amount ($)
        <input id="dAmount" type="number" min="0.01" step="0.01" required placeholder="0.00">
      </label>
      <label>What was it?
        <input id="dNote" type="text" maxlength="80" placeholder="e.g. Coffee, Bus ticket">
      </label>
      <label>Category
        <select id="dCat">
          <option>Food</option><option>Coffee</option><option>Transport</option>
          <option>Shopping</option><option>Health</option><option>Fun</option><option>Other</option>
        </select>
      </label>
      <button type="submit" class="primary">Add payment</button>
    </form>
    <ul id="dayList" class="list"></ul>
  </section>
  <section class="grid2">
    <div class="panel"><h2>Spending per day</h2><div id="dayChart"></div></div>
    <div class="panel"><h2>Days this month</h2><ul id="dayHistory" class="list"></ul></div>
  </section>
</main>
<footer>Data is stored only in your browser (localStorage).</footer>
<script src="app.js"></script>
</body>
</html>
